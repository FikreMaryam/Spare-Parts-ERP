<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shop Website{% endblock %}</title>
    <style>
        :root {
            --primary: #007bff;
            --secondary: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --light: #f8f9fa;
            --dark: #343a40;
            --bg: #ffffff;
            --text: #212529;
            --border: #dee2e6;
        }
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); }
        header { background: var(--dark); color: white; padding: 1rem; text-align: center; }
        nav { background: var(--light); padding: 0.5rem; }
        nav a { margin: 0 1rem; text-decoration: none; color: var(--text); }
        nav a:hover { color: var(--primary); }
        main { padding: 1rem; }
        .btn { display: inline-block; padding: 0.5rem 1rem; background: var(--primary); color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin: 1rem 0; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .product-card { border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; }
        .product-card img { max-width: 100%; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <header>
        <h1>Spare Parts Shop</h1>
    </header>
    <nav>
        <a href="{% url 'store:product_list' %}">Home</a>
        <a href="{% url 'store:cart' %}">Cart ({{ cart_count|default:0 }})</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
