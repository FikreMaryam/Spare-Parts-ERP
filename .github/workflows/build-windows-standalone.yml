name: Build Windows standalone app

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-windows-standalone.yml"
      - "**/*.py"
      - "**/*.html"
      - "**/*.css"
      - "**/static/**"
      - "app_icon.ico"
      - "requirements.txt"
      - "build_exe.py"
      - "launcher.py"
      - "WINDOWS_STANDALONE_README.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Django configuration
        env:
          DEBUG: "True"
          USE_SQLITE: "True"
          CREATE_DEFAULT_ADMIN: "False"
        run: python manage.py check

      - name: Collect current static files
        env:
          DEBUG: "True"
          USE_SQLITE: "True"
          CREATE_DEFAULT_ADMIN: "False"
        run: python manage.py collectstatic --noinput

      - name: Build standalone Windows application
        run: python build_exe.py

      - name: Verify packaged application and create ZIP
        shell: pwsh
        run: |
          $app = "dist/SparePartsERP"
          if (-not (Test-Path "$app/SparePartsERP.exe")) {
            throw "PyInstaller did not produce SparePartsERP.exe"
          }
          if (-not (Test-Path "$app/_internal/python312.dll")) {
            throw "The packaged Python runtime was not found"
          }
          if (-not (Test-Path "$app/_internal/reports")) {
            throw "The reports app was not included in the build"
          }
          Compress-Archive -Path $app -DestinationPath "SparePartsERP-Windows-Standalone.zip" -CompressionLevel Optimal

      - name: Upload Windows standalone ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SparePartsERP-Windows-Standalone
          path: SparePartsERP-Windows-Standalone.zip
          if-no-files-found: error
          retention-days: 30
