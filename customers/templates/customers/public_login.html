<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4 fw-bold">SaaS Admin Login</h3>
            
            {% if form.errors %}
                <div class="alert alert-danger p-2">
                    Invalid username or password.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" autofocus required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <!-- Redirects superadmins to the saas_dashboard inside CustomLoginView get_success_url or next param -->
                <input type="hidden" name="next" value="{% url 'saas_dashboard' %}">
                <button type="submit" class="btn btn-primary w-100 fw-bold">Log In</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{% url 'landing' %}" class="text-decoration-none text-muted small">&larr; Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
